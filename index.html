<script>
// ------------------ Page H1 Typing ------------------
const text = "This is my Page";
const h1 = document.querySelector("h1 .typing");
let i = 0;

function typePageText() {
  if (i < text.length) {
    h1.textContent += text.charAt(i);
    i++;
    setTimeout(typePageText, 100);
  }
}
typePageText();

// ------------------ Title Typing ------------------
const titles = ["Retro Site", "Cool Stuff", "Terminal Mode", "Welcome Senpai"];
let ti = 0;
let charIndex = 0;
let deleting = false;

function typeTitle() {
  let current = titles[ti];
  
  if (!deleting && charIndex <= current.length) {
    document.title = current.substring(0, charIndex) || "💀"; // overwrite fully
    charIndex++;
    setTimeout(typeTitle, 150);
  } 
  else if (deleting && charIndex >= 0) {
    document.title = current.substring(0, charIndex) || "😎";
    charIndex--;
    setTimeout(typeTitle, 100);
  } 
  else {
    if (!deleting) {
      deleting = true;
      setTimeout(typeTitle, 1000); // pause before deleting
    } else {
      deleting = false;
      ti = (ti + 1) % titles.length;
      setTimeout(typeTitle, 500); // pause before retyping next
    }
  }
}
typeTitle();
</script>
  </body>
