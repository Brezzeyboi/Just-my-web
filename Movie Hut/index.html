<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hut - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">Movie Hut</div>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search videos..." class="search-bar">
            <span class="user-name" id="user-name">Welcome, Guest</span> <!-- Placeholder for the user's name -->
        </div>
    </header>

    <main>
        <section id="video-list" class="video-list">
            <!-- Sample video thumbnails and titles -->
            <div class="video" onclick="playVideo('video1')">
                <img src="horimiya 1.jpg" alt="Video 1">
                <h3>Harry Putter moive in full 16k</h3>
            </div>
            <div class="video" onclick="playVideo('video2')">
                <img src="horimiya 2.png" alt="Video 2">
                <h3>Harry Putter 2 in 60k resoulation</h3>
            </div>
            <div class="video" onclick="playVideo('video3')">
                <img src="thumbnail3.jpg" alt="Video 3">
                <h3>Mera edit hai ranuak mat dekh dekha na hai toh dekh mero kya</h3>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        // On page load, fetch the username from localStorage
        window.onload = function () {
            const userName = localStorage.getItem("userName"); // Retrieve username from localStorage

            if (userName) {
                // If the user is logged in, display their name
                document.getElementById("user-name").textContent = `Welcome, ${userName}`;
            } else {
                // If no user is logged in, display "Guest"
                document.getElementById("user-name").textContent = "Welcome, Guest";
            }
        };
    </script>
</body>
</html>
