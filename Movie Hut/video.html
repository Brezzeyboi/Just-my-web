<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hut - Video</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">Movie Hut</div>
        <span class="user-name" id="user-name">Welcome, Guest</span> <!-- Placeholder for the user's name -->
        <button onclick="goBack()">Back to Home</button>
    </header>

    <main>
        <section class="video-player">
            <video id="video-player" controls>
                <source src="Chrolicle moon.mkv" type="video/mp4"> <!-- Replace with actual video file -->
                Your browser does not support the video tag.
            </video>
            <h2>Doremone Moive</h2>
            <p>This Doremon Hindi moive . Name is doraemon chronicle of the moon exploration</p>
            <p>This moive can be downloaded have fun 😊</p>
            </section>
        </section>
    </main>

    <script>
        function goBack() {
            window.history.back();
        }

        // On page load, fetch the username from localStorage
        window.onload = function () {
            const userName = localStorage.getItem("userName"); // Retrieve username from localStorage

            if (userName) {
                // If the user is logged in, display their name
                document.getElementById("user-name").textContent = `Welcome, ${userName}`;
            } else {
                // If no user is logged in, display "Guest"
                document.getElementById("user-name").textContent = "Welcome, Guest";
            }
        };
    </script>
</body>
</html>
